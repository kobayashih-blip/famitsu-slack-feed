name: Famitsu news to Slack (cron-job.org)

run-name: Famitsu feed / ${{ github.event_name }}

on:
  # 定期実行はcron-job.orgからGitHub API経由で起動する。
  # GitHub内蔵scheduleは意図的に使用しない。
  workflow_dispatch:
    inputs:
      notify_existing:
        description: "初回でも既存記事を通知する"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: famitsu-news-to-slack
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test
        # package.jsonのnpm scriptに依存せず、テストランナーを直接起動する。
        run: node --test test/*.test.mjs

      - name: Fetch and notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MAX_PAGES: "10"
          BOOTSTRAP_NOTIFY: ${{ inputs.notify_existing || 'false' }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/famitsu-slack-feed.mjs; then
              exit 0
            fi
            echo "Attempt ${attempt}/3 failed. Retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Persist feed state
        if: always()
        run: |
          if git diff --quiet -- data/seen.json feed.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json feed.xml
          git commit -m "chore: update Famitsu feed state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "State push ${attempt}/3 failed. Retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Report failure to Slack
        if: failure()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            exit 0
          fi
          node -e 'fetch(process.env.SLACK_WEBHOOK_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:`⚠️ Famitsuニュース自動通知が3回失敗しました。ログ: ${process.env.RUN_URL}`})}).then(r=>{if(!r.ok)process.exit(1)})'
